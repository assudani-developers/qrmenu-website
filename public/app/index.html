<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/app/">
  <meta charset="UTF-8">
  <!-- maximum-scale stops iOS zooming into fields; resizes-content keeps the keyboard from pushing the page around -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="Run your restaurant's QR menu, live orders and tables from your phone.">
  <meta name="theme-color" content="#22152E">

  <!-- iPhone / iPad: installable from Safari via Share → Add to Home Screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="QR Menu">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>QR Menu Pro — Owner</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #EEF0EB; overflow: hidden; overscroll-behavior: none; -webkit-overflow-scrolling: touch; }
    /* iPhone Safari: avoid position:fixed on body which clashes with visualViewport keyboard resize */
    body { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
    flt-glass-pane, flutter-view { width: 100%; height: 100%; touch-action: manipulation; }
    input, textarea { font-size: 16px !important; }
    /* branded splash while the app loads, so a slow network never looks like a blank or frozen page */
    #splash { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(80% 60% at 80% 0%, #4a2b66 0%, transparent 60%), #180D24; transition: opacity .45s ease; z-index: 9; }
    #splash.gone { opacity: 0; pointer-events: none; }
    #splash .box { display: flex; flex-direction: column; align-items: center; gap: 22px; font: 700 15px/1.3 -apple-system, system-ui, sans-serif; color: rgba(255,255,255,.7); }
    #splash img { width: 92px; height: 92px; border-radius: 24px; box-shadow: 0 20px 50px -12px rgba(0,0,0,.6); animation: pop .7s cubic-bezier(.34,1.4,.64,1) both; }
    #splash .bar { width: 140px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
    #splash .bar i { display: block; width: 40%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #F5DA97, #DDA544); animation: slide 1.1s ease-in-out infinite; }
    @keyframes pop { from { transform: scale(.7); opacity: 0 } }
    @keyframes slide { from { transform: translateX(-110%) } to { transform: translateX(260%) } }
    @media (prefers-reduced-motion: reduce) { #splash img, #splash .bar i { animation: none } }
  </style>
</head>
<body>
  <div id="splash" aria-live="polite"><div class="box"><img src="icons/Icon-192.png" alt=""><div class="bar"><i></i></div><span>Opening your restaurant…</span></div></div>
  <script>
    // hide the splash on Flutter's first frame
    window.addEventListener('flutter-first-frame', function () { var s = document.getElementById('splash'); if (s) { s.classList.add('gone'); setTimeout(function () { s.remove(); }, 600); } });

    // Web Push bridge used by lib/core/push/web_push_web.dart
    (function () {
      var SW = 'push-sw.js';
      var ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
      var standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
      function b64(s) { var p = '='.repeat((4 - s.length % 4) % 4); var r = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); var a = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) a[i] = r.charCodeAt(i); return a; }
      function reg() { return navigator.serviceWorker.register(SW, { scope: './' }).then(function () { return navigator.serviceWorker.ready; }); }
      function call(api, token, path, body) { return fetch(api + path, { method: body ? 'POST' : 'GET', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token }, body: body ? JSON.stringify(body) : undefined }).then(function (r) { return r.json(); }); }
      var ok = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
      if ('serviceWorker' in navigator) reg().catch(function () {});
      window.qrPush = {
        state: function () {
          if (ios && !standalone) return Promise.resolve('install');
          if (!ok) return Promise.resolve('unsupported');
          if (Notification.permission === 'denied') return Promise.resolve('denied');
          return reg().then(function (r) { return r.pushManager.getSubscription(); }).then(function (s) { return s ? 'on' : 'off'; });
        },
        enable: function (api, token) {
          if (ios && !standalone) return Promise.resolve('install');
          if (!ok) return Promise.resolve('unsupported');
          return Notification.requestPermission().then(function (p) {
            if (p !== 'granted') return p === 'denied' ? 'denied' : 'off';
            return Promise.all([reg(), call(api, token, '/owner/push/key')]).then(function (x) {
              return x[0].pushManager.getSubscription().then(function (old) {
                return old || x[0].pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(x[1].publicKey) });
              });
            }).then(function (sub) { return call(api, token, '/owner/push/subscribe', { subscription: sub.toJSON() }); })
              .then(function () { return call(api, token, '/owner/push/test', {}); }).then(function () { return 'on'; });
          }).catch(function () { return 'error'; });
        },
        disable: function (api, token) {
          if (!ok) return Promise.resolve('off');
          return reg().then(function (r) { return r.pushManager.getSubscription(); }).then(function (s) {
            if (!s) return 'off';
            var ep = s.endpoint;
            return s.unsubscribe().then(function () { return call(api, token, '/owner/push/unsubscribe', { endpoint: ep }); }).then(function () { return 'off'; });
          }).catch(function () { return 'off'; });
        },
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
